$kind: http-request
name: Categorías con token válido
method: GET
url: '{{baseUrl}}/api/categorias'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Token válido permite listar categorías', function () {
        pm.response.to.have.status(200)
      })

      pm.test('La respuesta es una lista', function () {
        pm.expect(pm.response.json()).to.be.an('array')
      })
