$kind: http-request
name: Sucursales con token válido
method: GET
url: '{{baseUrl}}/api/sucursales'
order: 4100
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Token válido permite listar sucursales', function () {
        pm.response.to.have.status(200)
      })

      pm.test('La respuesta es una lista de sucursales', function () {
        pm.expect(pm.response.json()).to.be.an('array')
      })
