$kind: http-request
name: Almacenes con token válido
method: GET
url: '{{baseUrl}}/api/almacenes'
order: 4150
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Token válido permite listar almacenes', function () {
        pm.response.to.have.status(200)
      })

      pm.test('La respuesta es una lista de almacenes', function () {
        pm.expect(pm.response.json()).to.be.an('array')
      })
