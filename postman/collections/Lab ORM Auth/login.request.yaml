$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "correo": "{{testEmail}}",
      "password": "{{testPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json()

      pm.test('Login devuelve 200', function () {
        pm.response.to.have.status(200)
      })

      pm.test('Login devuelve un token JWT', function () {
        pm.expect(body.token).to.be.a('string').and.not.empty
        pm.expect(body.token.split('.')).to.have.lengthOf(3)
      })

      pm.test('Login no expone la contraseña', function () {
        pm.expect(body.usuario.password).to.be.undefined
      })

      if (body.token) {
        pm.collectionVariables.set('token', body.token)
      }
